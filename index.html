<!DOCTYPE html>
<html>
<head>
    <title>Super Mario</title>
    <link rel="icon" href="data:,"/>
    <link rel="stylesheet" href="/css/main.css"/>
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <canvas id="screen" width="256" height="240" class="aspect-4-3"></canvas>

    <!--
      启动画面（本项目新增）：原本打开页面到游戏可玩之间是一段纯黑（Phaser 启动、
      bundle 解析、点击后才开始拉素材），没有任何反馈。这里用内联标记 + 内联样式
      做一层纯视觉的启动画面——不依赖任何 JS，页面一打开立刻渲染；真正的预加载
      进度由 src/boot.ts 驱动，游戏第一帧就绪后由它淡出。
      pointer-events: none 让点击穿透到画布（Phaser 的「点击开始」不受影响）；
      不写进 public/css/main.css 是因为那份文件要逐字节保持原版。
    -->
    <div id="boot" aria-hidden="true">
        <div class="boot-title">SUPER MARIO</div>
        <div class="boot-hint">CLICK TO START</div>
        <div class="boot-progress" id="boot-progress">NOW LOADING 0/0</div>
    </div>
    <style>
        #boot {
            position: fixed; inset: 0; z-index: 5; pointer-events: none;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            font-family: 'Courier New', ui-monospace, Menlo, monospace;
            transition: opacity .45s ease;
        }
        #boot.boot-hidden { opacity: 0; }
        .boot-title { color: #e79c21; font-size: 42px; font-weight: 700; letter-spacing: 9px; text-shadow: 3px 3px 0 #6b2b00; }
        .boot-hint { color: #fcfcfc; font-size: 14px; letter-spacing: 4px; animation: boot-blink 1.1s steps(1) infinite; }
        .boot-progress { color: #7a7a7a; font-size: 11px; letter-spacing: 2px; }
        @keyframes boot-blink { 50% { opacity: 0; } }
    </style>
</body>
</html>
